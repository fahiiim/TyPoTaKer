task: gec
run_name: gec_stage2_v4
model: configs/model/stage2_85m.yaml
init_from: checkpoints/lm_stage2_v4
data:
  train_paths:
    - data/processed/gec/v4/train.jsonl
  tokenizer_path: data/tokenizer/tokenizer.json
  seq_len: 128
  pack_sequences: false
optim:
  lr: 0.00015
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 400
  max_steps: 16000
  grad_clip: 1.0
train:
  micro_batch_size: 48
  grad_accum: 2
  amp_dtype: bf16
  compile: false
  compile_mode: default
  seed: 42
  max_hours: 3.0
  log_every: 25
  save_every_steps: 500
  keep_last: 3
  checkpoint_dir: checkpoints
  resume: "auto"
  num_workers: 0
  keep_downweight: 0.2
