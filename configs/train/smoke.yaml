# 10-minute sanity run. Use this before any 6-hour job.
task: lm
run_name: smoke
model: configs/model/stage0_25m.yaml
data:
  train_paths:
    - data/processed/lm/smoke.jsonl
  tokenizer_path: data/tokenizer/tokenizer.json
  seq_len: 128
  pack_sequences: true
optim:
  lr: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 20
  max_steps: 80
  grad_clip: 1.0
train:
  micro_batch_size: 4
  grad_accum: 1
  amp_dtype: bf16
  compile: false
  compile_mode: default
  seed: 1
  max_hours: 0.25
  log_every: 5
  save_every_steps: 40
  keep_last: 2
  checkpoint_dir: checkpoints
  resume: auto
  num_workers: 0
