task: lm
run_name: lm_stage0
model: configs/model/stage0_25m.yaml
data:
  train_paths:
    - data/processed/lm/train.jsonl
  tokenizer_path: data/tokenizer/tokenizer.json
  seq_len: 256
  pack_sequences: true
optim:
  lr: 0.0006
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 200
  max_steps: 20000
  grad_clip: 1.0
train:
  micro_batch_size: 32
  grad_accum: 4
  amp_dtype: bf16
  compile: true
  compile_mode: default
  seed: 42
  max_hours: 6.0
  log_every: 20
  save_every_steps: 400
  keep_last: 4
  checkpoint_dir: checkpoints
  resume: auto
  num_workers: 0
