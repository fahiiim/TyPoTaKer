task: gec
run_name: gec_stage1_ablation_c_01
model: configs/model/stage1_40m.yaml
init_from: checkpoints/lm_stage1
data:
  train_paths:
    - data/processed/gec/v2/train.jsonl
  tokenizer_path: data/tokenizer/tokenizer.json
  seq_len: 128
  pack_sequences: false
optim:
  lr: 0.0002
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 100
  max_steps: 2500
  grad_clip: 1.0
train:
  # Batch 96 utilizes RTX 5070 compute units heavily (80%+ target)
  micro_batch_size: 96
  grad_accum: 1
  amp_dtype: bf16
  compile: true
  compile_mode: default
  seed: 42
  max_hours: 1.0
  log_every: 25
  save_every_steps: 500
  keep_last: 2
  checkpoint_dir: checkpoints
  resume: auto
  num_workers: 0
  keep_downweight: 0.1
