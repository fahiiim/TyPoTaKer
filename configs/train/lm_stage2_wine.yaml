task: lm
run_name: lm_stage2_wine
model: configs/model/stage2_85m.yaml
init_from: checkpoints/lm_stage2_v4
data:
  train_paths:
    - data/processed/lm/train_v5_wine.jsonl
  tokenizer_path: data/tokenizer/tokenizer.json
  seq_len: 128
  pack_sequences: true
optim:
  lr: 0.00003
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 50
  max_steps: 1000
  grad_clip: 1.0
train:
  micro_batch_size: 32
  grad_accum: 2
  amp_dtype: bf16
  compile: false
  compile_mode: default
  seed: 42
  max_hours: 0.5
  log_every: 25
  save_every_steps: 250
  keep_last: 3
  checkpoint_dir: checkpoints
  resume: "none"
  num_workers: 0
