task: gec
run_name: gec_stage0
model: configs/model/stage0_25m.yaml
# Load LM weights if present, keep optimizer fresh for the new head.
init_from: checkpoints/lm_stage0
data:
  train_paths:
    - data/processed/gec/train.jsonl
  tokenizer_path: data/tokenizer/tokenizer.json
  seq_len: 128
  pack_sequences: false
optim:
  lr: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 150
  max_steps: 12000
  grad_clip: 1.0
train:
  micro_batch_size: 32
  grad_accum: 2
  amp_dtype: bf16
  compile: true
  compile_mode: default
  seed: 42
  max_hours: 6.0
  log_every: 20
  save_every_steps: 400
  keep_last: 4
  checkpoint_dir: checkpoints
  resume: auto
  num_workers: 0
