task: lm
run_name: lm_stage2
model: configs/model/stage2_85m.yaml
init_from: checkpoints/lm_stage2
data:
  train_paths:
    - data/processed/lm/train.jsonl
  tokenizer_path: data/tokenizer/tokenizer.json
  seq_len: 256
  pack_sequences: true
optim:
  lr: 0.0002
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 200
  max_steps: 5000
  grad_clip: 1.0
train:
  micro_batch_size: 24
  grad_accum: 4
  amp_dtype: bf16
  compile: false
  compile_mode: default
  seed: 42
  max_hours: 1.5
  log_every: 25
  save_every_steps: 500
  keep_last: 3
  checkpoint_dir: checkpoints
  resume: auto
  num_workers: 0
