# Stage 1 — grow depth 8→10 and width 384→512 from a Stage 0 checkpoint.
#   python -m typotaker grow --src checkpoints/lm_stage0 --config configs/model/stage1_40m.yaml --run-name lm_stage1
name: typoformer_stage1_40m
architecture: typoformer
vocab_size: 16000
d_model: 512
n_layers: 10
n_heads: 8
n_kv_heads: 2
ffn_hidden: 1408
max_seq_len: 256
dropout: 0.0
rope_theta: 10000.0
tie_embeddings: true
char_vocab_size: 128
char_dim: 48
max_chars_per_token: 16
n_replace_classes: 2048
n_append_classes: 2048
char_gate_init: 0.1
qk_norm: true
n_mtp: 2
grow_from_stage: stage0_25m
